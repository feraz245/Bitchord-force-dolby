
name: Build BitChord APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild source ZIP
        run: |
          cat BitChord-source.zip.part* > source.zip
          unzip -q source.zip -d source

      - name: Locate player labels
        working-directory: source/BitChord-main
        run: |
          echo "=== BUSCANDO ETIQUETAS DE AUDIO ==="
          grep -RIn \
            --include="*.kt" \
            --include="*.xml" \
            --include="*.java" \
            -E 'AAC Stereo|Dolby Atmos|Atmos' . \
            | head -n 150 || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: source/BitChord-main
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Atmos-Test
          path: |
            source/BitChord-main/**/*.apk
          if-no-files-found: error
          
